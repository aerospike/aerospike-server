name: Build, sign, and deploy

on:
  workflow_dispatch:
    inputs:
      upload_built_artifacts_jfrog:
        description: Upload built artifacts to JFrog (only runs on master, hotfix/**, preview/**)
        type: boolean
        default: true
      build_docker_images:
        description: Build Docker images
        type: boolean
        default: true
      push_docker_jfrog:
        description: Push Docker images to JFrog (only on master, hotfix/**, preview/**; when false, images are built/tested but not pushed)
        type: boolean
        default: true
      docker_mutable_tags:
        description: >-
          Update the mutable Docker tags. 'auto' applies w.x.y.z, w.x.y and w.x on master and
          w.x.y.z, w.x.y on hotfix/**; 'force' applies the master set on any ref that pushes
          images (a preview build then owns the shared tags); 'off' leaves them untouched.
        type: choice
        options:
          - auto
          - force
          - "off"
        default: auto
      slack_notify:
        description: Send Slack notifications (only applies on manual runs when artifacts upload, Docker push, and this flag are all enabled)
        type: boolean
        default: false
      ext:
        description: "Package name suffix appended to edition (e.g. TEST). Leave empty for production builds."
        required: false
        default: ""
  schedule:
    # GitHub cron is UTC only. Two daily UTC times bracket 8pm America/Los_Angeles across
    # PST vs PDT; job schedule-gate exits unless the current LA wall-clock hour is 20.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'

# Serialize runs by workflow + branch: no two runs on the same ref can
# publish the same jf-build-id concurrently. cancel-in-progress: false queues
# a second run rather than cancelling it; by the time it starts, jfrog-precheck
# will see build_exists=true and skip upload/bundle automatically.
# NOTE: keyed on ref (not sha) so that two concurrent runs triggered against the
# same HEAD commit — which produce the same build/version output and therefore the
# same jf-build-id coordinate — are serialized. The second run, once unblocked, sees
# build_exists=true from jfrog-precheck and skips upload/bundle automatically.
# Consecutive commits on the same branch are still serialized by this group (it keys on
# ref, not sha), but produce distinct jf-build-ids (different -n suffix) so neither run
# skips the other's upload via build_exists.
concurrency:
  # Ref-keyed for publishing runs (workflow_dispatch): serialize runs on the same ref so no
  # two publish the same jf-build-id concurrently. Scheduled runs get their OWN fixed group —
  # they only DISPATCH child workflow_dispatch runs (each ref-serialized on its own), so they
  # must not queue behind an in-flight manual run on the branch; otherwise schedule-gate's 8pm-LA
  # window could pass while the run waits, silently dropping that night's dispatch.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  JFROG_PROJECT: database
  # Pin for aerospike-server.docker, consumed by BOTH docker-context (which runs
  # docker-build.sh -g to generate the contexts) and docker-test (which runs
  # test.sh against them). Hoisted here because a partial bump -- three of the
  # four checkouts updated, one missed -- would generate the Dockerfile from one
  # commit and validate it with test.sh from another, and both jobs would pass.
  DOCKER_IMAGE_REPO_REF: 76d714ee55389b9c379261968f5bb20bccb4b1b2
  JFROG_URL: https://aerospike.jfrog.io
  # Scheduled nightly runs are gated by the repository variable BUILD_SIGN_DEPLOY_ENABLED
  # (Settings → Secrets and variables → Actions → Variables). When unset or not 'true', the
  # schedule path is skipped. This gates ONLY the schedule trigger; workflow_dispatch (manual
  # runs and nightly child dispatches) is always available regardless of this variable.
  # The release-ref policy (JFrog upload, release bundles, Docker push, promote-to-test run only
  # on master / hotfix/** / preview/**) is computed once in the setup job and consumed via
  # needs.setup.outputs.IS_RELEASE_REF == 'true'. nightly-dispatch-branches applies the same
  # policy in bash because it runs before setup.

jobs:
  schedule-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip_all: ${{ steps.gate.outputs.skip_all }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Gate scheduled runs to 8pm America/Los_Angeles
        id: gate
        env:
          ENABLED: ${{ vars.BUILD_SIGN_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # Only the schedule trigger is gated by BUILD_SIGN_DEPLOY_ENABLED. workflow_dispatch
          # (manual + nightly child dispatches) always proceeds.
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ENABLED" != "true" ]]; then
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
            echo "Skipping schedule: BUILD_SIGN_DEPLOY_ENABLED is not 'true' (got '${ENABLED:-<unset>}')."
            exit 0
          fi
          # Decide from the cron that FIRED (github.event.schedule) plus today's LA UTC offset,
          # NOT the wall-clock hour at execution time: a run that queues before starting could
          # otherwise begin well after 8pm LA and be dropped. DST transitions happen at 02:00
          # local, far from these evening crons, so the offset is stable across any realistic
          # queue delay. LA hour = (cron UTC hour + signed offset hours) mod 24; 10# forces
          # base-10 so a leading-zero hour is never parsed as octal.
          utc_hour="$(awk '{print $2}' <<<"$SCHEDULE")"
          offset="$(TZ=America/Los_Angeles date +%z)"   # -0800 (PST) / -0700 (PDT)
          off_hours="$((10#${offset:1:2}))"
          if [[ "${offset:0:1}" == "-" ]]; then
            la_hour="$(( (10#$utc_hour - off_hours + 24) % 24 ))"
          else
            la_hour="$(( (10#$utc_hour + off_hours) % 24 ))"
          fi
          if [[ "$la_hour" != "20" ]]; then
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: cron '${SCHEDULE}' maps to LA hour ${la_hour}, not 20 (offset ${offset})."
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            echo "cron '${SCHEDULE}' maps to 8pm LA (offset ${offset}); scheduled work may proceed."
          fi

  nightly-dispatch-branches:
    needs: [schedule-gate]
    if: >
      github.repository_owner == 'citrusleaf' &&
      github.event_name == 'schedule' &&
      needs.schedule-gate.outputs.skip_all == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all remote branches
        run: |
          set -euo pipefail
          git remote set-branches origin '*'
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Dispatch this workflow for branches with commits in the last 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          since="24 hours ago"
          dispatched=0
          eligible=0
          failed=0

          mapfile -t refs < <(
            git for-each-ref --format='%(refname)' 'refs/remotes/origin/*' 2>/dev/null \
              | while IFS= read -r ref; do
                  short="${ref#refs/remotes/origin/}"
                  [[ "$short" == "HEAD" ]] && continue
                  if [[ "$short" == "master" ]] || [[ "$short" =~ ^hotfix/ ]] || [[ "$short" =~ ^preview/ ]]; then
                    printf '%s\n' "$ref"
                  fi
                done | sort -u
          )

          if [[ "${#refs[@]}" -eq 0 ]]; then
            echo "No remote refs matched master / hotfix/** / preview/**."
            exit 0
          fi

          for ref in "${refs[@]}"; do
            [[ -n "$ref" ]] || continue
            short="${ref#refs/remotes/origin/}"

            if ! git rev-parse -q --verify "${ref}" >/dev/null; then
              continue
            fi

            if [[ -z "$(git rev-list -1 --first-parent --since="${since}" "${ref}" 2>/dev/null || true)" ]]; then
              echo "Skip '${short}' (no commits in the last 24h)."
              continue
            fi

            echo "Dispatching workflow for '${short}' (commits in the last 24h)."
            # docker_mutable_tags=off: a nightly must keep only its immutable
            # <version>_<timestamp> tag. The release-coordinate regex in
            # docker-mutable-tags accepts the build-number suffix a nightly carries
            # (8.1.3.0-88 -> w.x.y.z=8.1.3.0), and on master the case arm takes all
            # three tags -- so a nightly would repoint :8.1.3.0, :8.1.3 and :8.1 in
            # both dev-local and test-local at that night's build, overwriting the
            # release they were pointed at. That is the same contention
            # versions-override=" " exists to avoid; applying it here would only
            # reintroduce it further down the graph.
            eligible=$((eligible + 1))
            # The dispatch API validates -f inputs against the workflow definition on the
            # TARGET ref, so an input added here is rejected ("Unexpected inputs provided")
            # on any branch that has not picked it up yet -- every active hotfix line, for
            # docker_mutable_tags. Keep the per-ref warning, but count the failures: a run
            # where every eligible ref was rejected must not look like a quiet success.
            gh workflow run build-sign-deploy.yaml \
              --repo "${repo}" \
              --ref "${short}" \
              -f upload_built_artifacts_jfrog=true \
              -f build_docker_images=true \
              -f push_docker_jfrog=true \
              -f docker_mutable_tags=off \
              -f slack_notify=false \
              -f ext= || { echo "::warning::dispatch failed for '${short}', continuing."; failed=$((failed + 1)); continue; }
            dispatched=$((dispatched + 1))
          done

          echo "Dispatched ${dispatched} of ${eligible} eligible ref(s); ${failed} rejected."
          {
            echo "### Nightly dispatch"
            echo ""
            echo "| eligible | dispatched | rejected |"
            echo "|---|---|---|"
            echo "| ${eligible} | ${dispatched} | ${failed} |"
          } >>"$GITHUB_STEP_SUMMARY"

          # Nothing eligible is a legitimate quiet night. Something eligible and NOTHING
          # dispatched is a broken fan-out -- most likely every target ref rejecting an
          # input this file declares and they do not.
          if [[ "$eligible" -gt 0 && "$dispatched" -eq 0 ]]; then
            echo "::error::all ${eligible} eligible ref(s) were rejected; no nightly build was dispatched."
            exit 1
          fi
          if [[ "$failed" -gt 0 ]]; then
            echo "::warning::${failed} of ${eligible} eligible ref(s) were rejected -- those lines got no nightly build."
          fi

  setup:
    needs: [schedule-gate]
    # Gate the whole publish chain to the citrusleaf org: every downstream job
    # (jfrog-precheck, build-artifacts, and the rest) needs setup, so skipping it
    # in mirrors/forks cleanly skips them all — instead of jfrog-precheck running
    # and failing loudly against JFrog OIDC that only exists in citrusleaf.
    if: >
      github.repository_owner == 'citrusleaf' &&
      needs.schedule-gate.outputs.skip_all == 'false' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      VERSION: ${{ steps.set_env.outputs.version }}
      BUNDLE_VERSION: ${{ steps.set_env.outputs.bundle_version }}
      IS_RELEASE_REF: ${{ steps.set_env.outputs.is_release_ref }}
      MATRIX_INCLUDE: ${{ steps.build_matrix.outputs.matrix_include }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: set env
        id: set_env
        run: |
          set -euo pipefail
          # build/version is the single source of truth. It anchors on the bare (dev-began)
          # x.y.z.w tag, but in default mode (no -v) emits the full w.x.y.z-n coordinate on
          # master/hotfix (bare tag + build number). That full string becomes VERSION below —
          # i.e. the jf-build-id — so every commit maps to a unique, non-overwritten JFrog build.

          version="$(bash build/version)"

          if [[ ! "$GITHUB_REF_NAME" =~ ^[a-zA-Z0-9._/\-]+$ ]]; then
            echo "ERROR: GITHUB_REF_NAME contains unsafe characters: '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          branch_prefix="${GITHUB_REF_NAME//\//-}"
          # TEST- prefix dropped for parity with sign-build-deploy.yaml, which already uses
          # "${branch_prefix}-${version}" as the bundle coordinate. The concurrency group above
          # serializes runs on the same ref so jfrog-precheck prevents duplicate publication.
          bundle_version="${branch_prefix}-${version}"

          # Release-ref policy computed once here and consumed by every publish gate
          # (jfrog-precheck, upload, release-bundle, docker push, promote-to-test) via
          # needs.setup.outputs.IS_RELEASE_REF. Keep in sync with
          # nightly-dispatch-branches' ref filter. NOTE: preview/** is a release ref
          # (it publishes), but build/version deliberately keeps preview's -<n>-g<sha>
          # descriptor rather than the clean master/hotfix coordinate.
          if [[ "$GITHUB_REF_NAME" == "master" || "$GITHUB_REF_NAME" =~ ^hotfix/ || "$GITHUB_REF_NAME" =~ ^preview/ ]]; then
            is_release_ref=true
          else
            is_release_ref=false
          fi

          {
            echo "version=$version"
            echo "bundle_version=$bundle_version"
            echo "is_release_ref=$is_release_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Load build matrix (.github/ci/build-matrix.json)
        id: build_matrix
        run: |
          set -euo pipefail
          # Fail fast in setup on malformed JSON instead of an opaque fromJson error
          # in the build-artifacts matrix after fan-out.
          jq empty .github/ci/build-matrix.json
          {
            echo 'matrix_include<<MATRIX_JSON_EOF'
            cat .github/ci/build-matrix.json
            echo 'MATRIX_JSON_EOF'
          } >> "$GITHUB_OUTPUT"

  # Query JFrog for prior publication state (e.g. from a prior nightly). Runs in parallel
  # with the build pipeline. Two INDEPENDENT signals, because build-info existence does NOT
  # imply the release bundle was created — a run can upload artifacts then die before
  # create-release-bundle:
  #   build_exists  → build-info present    → gates upload-artifacts-to-jfrog.
  #   bundle_exists → release bundle present → gates create-release-bundle + docker build/push.
  # Keeping them separate lets a re-run finish a partially-published build-id (upload done,
  # bundle not) while still skipping an already-completed one. Fails closed on unexpected
  # build-info HTTP status codes.
  jfrog-precheck:
    needs: [setup]
    if: >
      needs.setup.result == 'success' &&
      needs.setup.outputs.IS_RELEASE_REF == 'true'
    runs-on: ubuntu-24.04
    outputs:
      build_exists: ${{ steps.check.outputs.build_exists }}
      bundle_exists: ${{ steps.check.outputs.bundle_exists }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ env.JFROG_URL }}
          JF_PROJECT: ${{ env.JFROG_PROJECT }}
        with:
          oidc-provider-name: database-gh-citrusleaf
          oidc-audience: database-gh-citrusleaf

      - name: Does this build-id / release bundle already exist in JFrog?
        id: check
        env:
          BUILD_NAME: aerospike-server
          BUNDLE_NAME: aerospike-server
          VERSION: ${{ needs.setup.outputs.VERSION }}
          BUNDLE_VERSION: ${{ needs.setup.outputs.BUNDLE_VERSION }}
          JFROG_PROJECT: ${{ env.JFROG_PROJECT }}
        run: |
          set -euo pipefail

          # 1) Build-info existence → gates the artifact upload.
          code=$(jf rt curl -s -o /dev/null -w '%{http_code}' \
            -XGET "/api/build/${BUILD_NAME}/${VERSION}?project=${JFROG_PROJECT}")
          case "$code" in
            200) echo "build_exists=true"  >> "$GITHUB_OUTPUT"
                 echo "Build ${BUILD_NAME}/${VERSION} already exists in JFrog — upload will be skipped." ;;
            404) echo "build_exists=false" >> "$GITHUB_OUTPUT"
                 echo "Build ${BUILD_NAME}/${VERSION} not found in JFrog — proceeding with upload." ;;
            *)   echo "::error::Unexpected HTTP ${code} from JFrog build-info API; failing closed."
                 exit 1 ;;
          esac

          # 2) Release-bundle existence → gates create-release-bundle independently of upload.
          # Fails closed, exactly like the build-info probe above: only a definitive JFrog
          # answer (exit 0 + parseable JSON with a release_bundles array) is trusted. Any
          # failure of the search — auth, network, rate limit, outage, malformed response —
          # fails this job rather than silently reporting "no bundle" and letting the
          # non-idempotent create-release-bundle run against a coordinate that may already be
          # bundled. jf release-bundle-search returns exit 0 with an empty release_bundles
          # array when the bundle has no versions yet (a genuine "does not exist", not an
          # error) — the same behavior the shared-workflows delete-release-bundle action relies on.
          rbs_rc=0
          bundle_json="$(jf release-bundle-search versions "${BUNDLE_NAME}" \
            --project="${JFROG_PROJECT}" --format=json)" || rbs_rc=$?
          if [[ "$rbs_rc" -ne 0 ]] || ! printf '%s' "$bundle_json" \
              | jq -e 'has("release_bundles")' >/dev/null 2>&1; then
            echo "::error::jf release-bundle-search versions ${BUNDLE_NAME} failed (exit ${rbs_rc}) or returned unparseable output; failing closed (see CLI error above)."
            exit 1
          fi
          if printf '%s' "$bundle_json" | jq -e --arg v "${BUNDLE_VERSION}" \
              '.release_bundles[]? | select(.release_bundle_version == $v)' >/dev/null 2>&1; then
            echo "bundle_exists=true"  >> "$GITHUB_OUTPUT"
            echo "Release bundle ${BUNDLE_NAME}/${BUNDLE_VERSION} already exists — create-release-bundle will be skipped."
          else
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release bundle ${BUNDLE_NAME}/${BUNDLE_VERSION} not found — create-release-bundle may proceed."
          fi

  build-artifacts:
    needs: setup
    if: github.repository_owner == 'citrusleaf' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      # The source checkout authenticates via create-github-app-token (private key), not OIDC.
      # id-token is here only for the JFrog OIDC exchange the build-info steps at the end of
      # this job need.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.MATRIX_INCLUDE) }}

    runs-on: ${{ matrix.host }}
    # Pinned base images: .github/ci/build-matrix.json (host, distro, container per matrix row).
    container: ${{ matrix.container }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Fetch app token
        id: app-token
        # v3 line is Node24-ready; requires modern runner (GH-hosted Ubuntu runners satisfy this).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install prereqs
        run: |
          set -euo pipefail

          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              apt-get update && apt-get install -y git ca-certificates python3
              ;;
            el*|amzn*)
              command -v dnf >/dev/null || microdnf install -y dnf
              dnf -y install git ca-certificates libyaml-devel python3
              if [[ "${{ matrix.distro }}" == "el8" ]]; then
                dnf -y install perl-IPC-Cmd perl-Time-Piece
              fi
              ;;
          esac

          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout aerospike-server
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Pin to github.sha — the exact dispatch-time commit that setup computed VERSION
          # (the jf-build-id) from. Checking out github.ref_name instead would fetch whatever
          # the branch tip is when THIS job starts, which — with cancel-in-progress: false
          # queuing runs for potentially hours — can be a different commit, so the binary would
          # compile a different commit than the jf-build-id it publishes under. HEAD is detached
          # at the sha; the next step reattaches the branch name for build/version.
          repository: citrusleaf/aerospike-server
          ref: ${{ github.sha }}
          submodules: true
          path: aerospike-server
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Reattach branch name at the pinned commit
        working-directory: aerospike-server
        # build/version relies on `git branch --show-current` to classify the release line;
        # a detached HEAD would fall back to the remote-branch heuristic and can misclassify.
        # Recreate the branch ref at the pinned sha so classification is unambiguous.
        run: git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Install required packages
        run: |
          bash "$GITHUB_WORKSPACE/aerospike-server/.github/bin/install_deps.bash" "${{ matrix.distro }}"

      - name: Configure git credential rewriting
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          dest="https://x-access-token:${TOKEN}@github.com/"
          git config --global "url.${dest}.insteadOf" "https://github.com/"
          git config --global --add "url.${dest}.insteadOf" "git@github.com:"
          git config --global --add "url.${dest}.insteadOf" "ssh://git@github.com/"
          git config --global --add "url.${dest}.insteadOf" "git://github.com/"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/aerospike-server"

      - name: Checkout aerospike-server-enterprise
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: >
          bash aerospike-server/.github/bin/checkout_private_repo.bash
          citrusleaf/aerospike-server-enterprise
          aerospike-server/modules/ee
          "$REF"

      - name: Checkout aerospike-server-fips
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: >
          bash aerospike-server/.github/bin/checkout_private_repo.bash
          citrusleaf/aerospike-server-fips
          aerospike-server/modules/fips
          "$REF"

      - name: Remove git credential rewriting
        if: always()
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global --unset-all \
            "url.https://x-access-token:${TOKEN}@github.com/.insteadOf" || true

      - name: Build and package
        working-directory: aerospike-server
        env:
          DISTRO: ${{ matrix.distro }}
          # Expose the host arch under two names:
          #   MATRIX_HOST - used by the YAML `if [[ ... ]]` below; aliased to dodge shellcheck SC2153
          #                 (shellcheck can't see that the lowercase matrix.host token drives this env).
          #   HOST        - required by .github/bin/build_edition.bash (see script header comment); the
          #                 fips branch inside do_edition() uses ${HOST:?...} to skip fips on arm64.
          MATRIX_HOST: ${{ matrix.host }}
          HOST: ${{ matrix.host }}
          EXT: ${{ github.event.inputs.ext }}
        run: |
          # Ubuntu 26.04 ships CMake 4.x, which removed compatibility with
          # cmake_minimum_required(VERSION <3.5). Set explicitly only for that
          # distro so the legacy CMakeLists in the EE 'snappy' submodule still
          # configures. Other matrix cells leave this unset.
          if [[ "${DISTRO}" == "ubuntu26.04" ]]; then
            export CMAKE_POLICY_VERSION_MINIMUM=3.5
          fi
          if [[ "${MATRIX_HOST}" == *arm* ]]; then
            bash .github/bin/build_edition.bash -e community -e enterprise
          else
            bash .github/bin/build_edition.bash
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-artifacts-${{ needs.setup.outputs.VERSION }}-${{ matrix.distro }}-${{ contains(matrix.host, 'arm') && 'aarch64' || 'x86_64' }}
          path: |
            aerospike-server/pkg/packages/*.deb
            aerospike-server/pkg/packages/*.rpm
          # A cell that built nothing must fail here. The default ('warn') would upload an
          # empty artifact, organize-built-artifacts would merge it invisibly, and the release
          # would ship missing that distro/arch with every job still green.
          if-no-files-found: error
          retention-days: 1

      # Build-info for this matrix cell, the one thing shared-workflows'
      # reusable_execute-build.yaml provides that a hand-rolled build job does not: the
      # environment the packages were compiled in and the commit they were compiled from.
      #
      # reusable_deploy-artifacts.yaml already looks for these. It searches
      # <project>-build-info for build-infos named "<jf-metadata-build-id>*" created in the
      # last day and build-appends each onto the final aerospike-server:<VERSION> record that
      # the release bundle references — so the id below MUST keep the
      # "${VERSION}-metadata" prefix this workflow passes as jf-metadata-build-id. Without
      # these, that search finds nothing (it is best-effort) and the published build-info
      # carries files and no provenance at all.
      #
      # No artifacts are attached here; deploy-artifacts uploads and records those separately
      # under "<VERSION>-artifacts".
      #
      # Both steps are best-effort: build-info is provenance, and losing it on one of 18 cells
      # is not worth failing a build matrix that already produced good packages. The step
      # summary shows which cells published.
      - name: Set up JFrog CLI
        id: jf
        if: >
          needs.setup.outputs.IS_RELEASE_REF == 'true' &&
          (github.event.inputs.upload_built_artifacts_jfrog == true ||
            github.event.inputs.upload_built_artifacts_jfrog == 'true')
        continue-on-error: true
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          # Must match reusable_deploy-artifacts.yaml's instance and project, or the
          # build-info this publishes is not the one that job later searches for.
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: ${{ env.JFROG_PROJECT }}
        with:
          version: 2.78.8
          oidc-provider-name: gh-citrusleaf
          oidc-audience: citrusleaf

      - name: Publish build-info for this build cell
        id: build_info
        if: steps.jf.outcome == 'success'
        continue-on-error: true
        working-directory: aerospike-server
        env:
          BUILD_NAME: aerospike-server
          BUILD_ID: ${{ needs.setup.outputs.VERSION }}-metadata-${{ matrix.distro }}-${{ contains(matrix.host, 'arm') && 'aarch64' || 'x86_64' }}
          PROJECT: ${{ env.JFROG_PROJECT }}
          # build-collect-env publishes the environment, so anything secret-shaped has to stay
          # out of it. This is the CLI's own default, set explicitly because the cost of it
          # silently changing is a leaked value in a build-info record.
          JFROG_CLI_ENV_EXCLUDE: "*password*;*psw*;*secret*;*key*;*token*"
          # Captured by build-collect-env, so the record says which container produced the
          # packages rather than just which runner did.
          AS_BUILD_DISTRO: ${{ matrix.distro }}
          AS_BUILD_CONTAINER: ${{ matrix.container }}
          AS_BUILD_HOST: ${{ matrix.host }}
          AS_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # build-add-git reads the work tree, so this runs in the checkout, not the workspace
          # root. Env and VCS are collected locally and only build-publish talks to JFrog.
          jf rt build-collect-env "$BUILD_NAME" "$BUILD_ID" --project="$PROJECT"
          jf rt build-add-git     "$BUILD_NAME" "$BUILD_ID" --project="$PROJECT"
          jf rt build-publish     "$BUILD_NAME" "$BUILD_ID" --project="$PROJECT"
          echo "Published build-info ${BUILD_NAME}/${BUILD_ID}"

      # continue-on-error leaves a failed step green at the job level, so say it out loud:
      # the run is still good, but this cell will be missing from the published build-info.
      - name: Report a missing build-info
        if: >
          always() &&
          steps.jf.outcome != 'skipped' &&
          steps.build_info.outcome != 'success'
        env:
          CELL: ${{ matrix.distro }}-${{ contains(matrix.host, 'arm') && 'aarch64' || 'x86_64' }}
        run: echo "::warning::no build-info published for ${CELL}; its packages are unaffected."

  organize-built-artifacts:
    needs: [build-artifacts, setup]
    if: ${{ always() && needs.build-artifacts.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      PACKAGE_VERSION: ${{ steps.extract_package_version.outputs.package_version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout (for extract_version.bash)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/bin/extract_version.bash
          sparse-checkout-cone-mode: false

      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-artifacts
          pattern: unsigned-artifacts-${{ needs.setup.outputs.VERSION }}*
          merge-multiple: true

      - name: List download files
        run: find build-artifacts

      - name: Extract package version from artifacts
        id: extract_package_version
        run: |
          set -euo pipefail
          pkg_version=$(bash .github/bin/extract_version.bash build-artifacts)
          echo "package_version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Extracted PACKAGE_VERSION: $pkg_version"

      - name: Upload packaged Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-artifacts-${{ needs.setup.outputs.VERSION }}
          path: |
            build-artifacts/**/*.deb
            build-artifacts/**/*.rpm
          overwrite: true
          retention-days: 1

  # Gate after matrix builds merge unsigned artifacts for signing.
  artifacts-ready:
    needs: [organize-built-artifacts]
    if: always() && needs.organize-built-artifacts.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      PACKAGE_VERSION: ${{ steps.pkg_version.outputs.package_version }}
    steps:
      - name: Set PACKAGE_VERSION from built artifacts
        id: pkg_version
        run: |
          echo "package_version=${{ needs.organize-built-artifacts.outputs.PACKAGE_VERSION }}" >> "$GITHUB_OUTPUT"
      - name: Gate
        run: echo "Artifacts ready for sign/deploy"

  sign-artifacts:
    needs: [setup, artifacts-ready]
    if: always() && needs.artifacts-ready.result == 'success'
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@v3.7.0
    with:
      gh-artifact-name: signed-artifacts-${{ needs.setup.outputs.VERSION }}      
      gh-unsigned-artifacts: unsigned-artifacts-${{ needs.setup.outputs.VERSION }}      
      # ubuntu-22.04 is not a preference, it is a hard requirement of this workflow:
      # shared-workflows' setup-gpg action opens with
      #   if [[ "$(cat /etc/os-release | grep VERSION_ID)" != *"22.04"* ]]; then exit 1
      # so signing fails immediately on any newer image (verified on run 34413538405).
      # Pinned rather than inherited so the constraint is visible here — when GitHub
      # retires the 22.04 image this breaks and only a shared-workflows fix unblocks it.
      runs-on: ubuntu-22.04
      gh-workflows-ref: "v3.7.0"
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  # Skipped automatically when jfrog-precheck finds the build-id already exists (e.g. prior nightly).
  upload-artifacts-to-jfrog:
    needs: [setup, sign-artifacts, jfrog-precheck]
    if: >
      always() &&
      needs.sign-artifacts.result == 'success' &&
      needs.jfrog-precheck.outputs.build_exists == 'false' &&
      needs.setup.outputs.IS_RELEASE_REF == 'true' &&
      (github.event.inputs.upload_built_artifacts_jfrog == true ||
        github.event.inputs.upload_built_artifacts_jfrog == 'true')
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@v3.7.0
    with:
      jf-project: database
      jf-build-name: "aerospike-server"
      version: ${{ needs.setup.outputs.VERSION }}
      oidc-provider-name: gh-citrusleaf
      oidc-audience: citrusleaf
      gh-artifact-name: signed-artifacts-${{ needs.setup.outputs.VERSION }}      
      gh-retention-days: 1
      dry-run: false
      jf-build-id: ${{ needs.setup.outputs.VERSION }}
      jf-metadata-build-id: ${{ needs.setup.outputs.VERSION }}-metadata
      # Pinned rather than inherited: these reusable workflows default runs-on to
      # ubuntu-22.04, which would put the release path on the oldest hosted image by
      # accident — and that is the next image GitHub retires. Unlike the sign job, nothing
      # here requires 22.04.
      #
      # The version split is deliberate, not drift: the Docker jobs need v4.1.0 for
      # gh-context-artifacts-json, which postdates v3.7.0. Bumping these three is
      # SERVER-1672 — the v4.1.0 create-release-bundle rewrites its entrypoint and adds
      # bundle-metadata annotation, so it wants its own push run to validate rather than
      # riding along here.
      runs-on: ubuntu-24.04
      gh-workflows-ref: "v3.7.0"

  # Gated on bundle_exists (NOT build_exists): a re-run whose build-info exists but whose
  # bundle was never created (partial publish — upload succeeded, then a later step failed)
  # must still create the bundle, while an already-bundled coordinate is skipped so this
  # non-idempotent job is never re-run against it. The build-info the bundle references is
  # present either because this run uploaded it (upload success) or a prior run already did
  # (build_exists gates the upload). docker-ready aggregates the whole Docker leg and
  # itself treats 'skipped' as acceptable, so a docker-disabled run
  # (build_docker_images=false) can still bundle; otherwise docker runs (it gates on
  # bundle_exists too) and any docker build/test failure blocks the bundle.
  create-release-bundle:
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [setup, sign-artifacts, upload-artifacts-to-jfrog, docker-ready, jfrog-precheck]
    if: >
      always() &&
      needs.sign-artifacts.result == 'success' &&
      needs.jfrog-precheck.outputs.bundle_exists == 'false' &&
      needs.setup.outputs.IS_RELEASE_REF == 'true' &&
      (needs.upload-artifacts-to-jfrog.result == 'success' ||
        needs.jfrog-precheck.outputs.build_exists == 'true') &&
      needs.docker-ready.result == 'success'
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@v3.7.0
    with:
      jf-project: "database"
      jf-build-names: "aerospike-server:${{ needs.setup.outputs.VERSION }}"
      jf-bundle-name: "aerospike-server"
      oidc-provider-name: gh-citrusleaf
      oidc-audience: citrusleaf
      version: ${{ needs.setup.outputs.BUNDLE_VERSION }}
      runs-on: ubuntu-24.04
      gh-workflows-ref: "v3.7.0"
      dry-run: false

  # Generate one standalone Docker build context per edition. docker-build.sh -g
  # stops after Dockerfile generation, and a local -u path makes it stage the
  # signed .deb alongside the Dockerfile and emit a COPY for it — turning each
  # release directory into a context the reusable Docker workflow can pick up as
  # a GitHub artifact (gh-context-artifacts-json).
  #
  # These images take the native .deb path, which carries no aerospike-tools bundle
  # and therefore no asadm of its own, so the standalone aerospike-asadm package is
  # installed explicitly. docker-build.sh treats an unresolved asadm as a warning,
  # which would silently produce images without an administration shell, so
  # prepare_docker_context.bash fails the build unless the resolved package actually
  # lands in the generated Dockerfile.
  #
  # The SERVER package is not best-effort: the script fails the build if it
  # resolves to a remote URL, because it must be the .deb this run just signed.
  docker-context:
    needs: [setup, artifacts-ready, sign-artifacts, jfrog-precheck]
    # Gate:
    #  - bundle_exists != 'true': gate on the release bundle (the terminal published
    #    state), NOT build_exists. A partial-publish retry (upload succeeded, then
    #    docker/bundle failed) sees build_exists='true' but bundle_exists='false' and
    #    STILL needs docker built+pushed; gating on build_exists would skip docker yet
    #    let create-release-bundle proceed, promoting a build-id to TEST with no docker
    #    images. Only an already-bundled coordinate (fully published) skips here.
    #  - jfrog-precheck result success|skipped: if the precheck itself FAILED (e.g. a
    #    JFrog outage tripping its fail-closed exit), the release tail is already dead,
    #    so building+scanning here would burn a full cycle for nothing. Gate on the job
    #    RESULT, not just its output value — a failed job emits bundle_exists='' which
    #    would otherwise pass the '' != 'true' check and run.
    # On dev refs jfrog-precheck is skipped, so result is 'skipped' and bundle_exists is
    # '' ('' != 'true') — images still build, and docker-test still exercises them
    # (rebuilt locally for amd64, since push=false leaves nothing in the registry).
    if: >
      always() &&
      needs.sign-artifacts.result == 'success' &&
      (needs.jfrog-precheck.result == 'success' ||
        needs.jfrog-precheck.result == 'skipped') &&
      needs.jfrog-precheck.outputs.bundle_exists != 'true' &&
      (github.event.inputs.build_docker_images == true ||
        github.event.inputs.build_docker_images == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # Stamped onto every image as a label below, so the asadm version travels
      # with the manifest into the release bundle rather than living only in this
      # job's log. "none" when ASADM_SOURCE=none.
      ASADM_VERSION: ${{ steps.contexts.outputs.asadm_version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout (for prepare_docker_context.bash)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/bin/prepare_docker_context.bash
          sparse-checkout-cone-mode: false

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-artifacts-${{ needs.setup.outputs.VERSION }}
          path: ./signed-artifacts

      - name: Checkout aerospike-server.docker repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: aerospike/aerospike-server.docker
          path: pkg/docker
          ref: ${{ env.DOCKER_IMAGE_REPO_REF }}
          fetch-depth: 1

      - name: Generate per-edition build contexts
        env:
          PACKAGE_VERSION: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
          ARTIFACTS_DIR: ${{ github.workspace }}/signed-artifacts
          DOCKER_REPO_DIR: ${{ github.workspace }}/pkg/docker
          OUT_DIR: ${{ github.workspace }}/docker-contexts
          EDITIONS: community enterprise federal
          DISTRO_FILTER: ubuntu
          # Where aerospike-asadm comes from: a direct .deb URL pins an exact
          # version, a local directory / .deb stages it via COPY, a JFrog repo
          # URL resolves the newest published one, and "none" builds without it.
          # A resolved remote package is SHA256-pinned into the Dockerfile and
          # verified at image build time.
          #
          # This is docker-build.sh's own default repo, named explicitly so the
          # source does not move if that default changes. It resolves the newest
          # asadm published for the image's distro and arch, which is deliberate:
          # asadm ships on its own release train, independent of the server
          # version this run builds.
          #
          # "Newest per arch" is resolved independently for amd64 and arm64, so
          # prepare_docker_context.bash requires that every arch an edition builds
          # resolved an asadm AND that they agree on the version. A release that
          # lands one arch first therefore fails the run -- re-runnable once the
          # second arch publishes -- rather than shipping an index whose halves
          # carry different asadm builds.
          #
          # Pinning a version is NOT just swapping in a direct .deb URL: -A applies
          # a direct package only to the arch its filename names, so an amd64 URL
          # leaves arm64 with no asadm and now fails the same check. A pin needs a
          # source covering every arch the edition builds; SERVER-1671 asks
          # aerospike-server.docker for a version selector that does this properly.
          #
          # Two runs of the same server version may therefore carry different asadm
          # builds. That is accepted, on the condition that what shipped is
          # recorded: the resolved version becomes the com.aerospike.asadm.version
          # image label below, so it travels with the manifest into the release
          # bundle. The image also carries a syft SBOM (the reusable workflow's
          # sbom input defaults true), so the installed package list is queryable
          # directly:
          #   docker buildx imagetools inspect <ref> --format '{{ json .SBOM }}'
          ASADM_SOURCE: https://aerospike.jfrog.io/artifactory/database-deb-prod-public-local
          # Must match the `dest` of every gh-context-artifacts-json entry below:
          # the script re-anchors the Dockerfile's COPY sources under this path.
          CTX_DEST: docker-ctx
        id: contexts
        run: bash .github/bin/prepare_docker_context.bash

      - name: Upload community build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-ctx-community-${{ needs.setup.outputs.VERSION }}
          path: docker-contexts/community
          if-no-files-found: error
          retention-days: 1

      - name: Upload enterprise build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-ctx-enterprise-${{ needs.setup.outputs.VERSION }}
          path: docker-contexts/enterprise
          if-no-files-found: error
          retention-days: 1

      - name: Upload federal build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-ctx-federal-${{ needs.setup.outputs.VERSION }}
          path: docker-contexts/federal
          if-no-files-found: error
          retention-days: 1

  # The three edition images. Separate jobs rather than a matrix: each needs its
  # own image-name/app-name, federal is amd64-only, and — unlike matrix legs —
  # named jobs expose per-edition immutable-tag/digest outputs that the scan,
  # bundle, and Slack jobs all consume.
  #
  # Each invocation publishes build-info as <jf-build-name>:${{ github.run_number }},
  # so the build names MUST differ per edition: a shared name would have the three
  # concurrent invocations overwrite each other at the same coordinate and the
  # release bundle would reference only whichever landed last.
  #
  # The -bsd suffix does the same across workflow files. github.run_number is
  # per-workflow-file, so this file and sign-build-deploy.yaml keep independent
  # counters over one Artifactory namespace; without the suffix a counter
  # alignment would let one pipeline's bundle reference the other's images.
  #
  # v4.1.0, not the v3.7.0 pinned elsewhere in this file: gh-context-artifacts-json
  # — the only way to get a generated Dockerfile plus its staged .deb into the build
  # context — was added after v3.7.0.
  docker-community:
    needs: [setup, artifacts-ready, docker-context, jfrog-precheck]
    if: always() && needs.docker-context.result == 'success'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@v4.1.0
    with:
      app-version: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
      app-name: Aerospike Server
      image-name: aerospike-server
      # jf-project + repo-scope resolve to artifact.aerospike.io/database-docker-dev-local
      # and also form the Artifactory repo key the docker build-info is created
      # against, so do NOT replace them with an explicit jf-registry.
      jf-project: database
      repo-scope: -docker-dev-local
      jf-build-name: aerospike-server-docker-community-bsd
      oidc-provider-name: database-gh-citrusleaf
      oidc-audience: database-gh-citrusleaf
      gh-context-artifacts-json: '[{"name":"docker-ctx-community-${{ needs.setup.outputs.VERSION }}","dest":"docker-ctx"}]'
      file: docker-ctx/Dockerfile
      platforms: linux/amd64,linux/arm64
      # versions-override is the only lever over the tag set and can only ADD to
      # the always-present immutable tag; a blank entry is dropped. So a single
      # blank leaves the immutable tag as the ONLY tag — no :latest / :<major> /
      # :<version> for concurrent builds to fight over, and the release bundle
      # references exactly one tag. The mutable w.x/w.x.y/w.x.y.z tags are applied
      # by docker-mutable-tags once the images are tested and promoted.
      versions-override: " "
      # The reusable workflow stamps its own OCI labels over the generated
      # Dockerfile's. Restore the ones that should keep pointing at the image
      # definition's home rather than at this repo.
      labels-json: '{"org.opencontainers.image.source":"https://github.com/aerospike/aerospike-server.docker","org.opencontainers.image.url":"https://github.com/aerospike/aerospike-server.docker","org.opencontainers.image.vendor":"Aerospike","org.opencontainers.image.documentation":"https://hub.docker.com/_/aerospike","com.aerospike.asadm.version":"${{ needs.docker-context.outputs.ASADM_VERSION }}"}'
      push: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.push_docker_jfrog == true ||
          github.event.inputs.push_docker_jfrog == 'true') &&
        needs.setup.outputs.IS_RELEASE_REF == 'true' &&
        needs.jfrog-precheck.outputs.bundle_exists == 'false' }}

  docker-enterprise:
    needs: [setup, artifacts-ready, docker-context, jfrog-precheck]
    if: always() && needs.docker-context.result == 'success'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@v4.1.0
    with:
      app-version: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
      app-name: Aerospike Enterprise Server
      image-name: aerospike-server-enterprise
      jf-project: database
      repo-scope: -docker-dev-local
      jf-build-name: aerospike-server-docker-enterprise-bsd
      oidc-provider-name: database-gh-citrusleaf
      oidc-audience: database-gh-citrusleaf
      gh-context-artifacts-json: '[{"name":"docker-ctx-enterprise-${{ needs.setup.outputs.VERSION }}","dest":"docker-ctx"}]'
      file: docker-ctx/Dockerfile
      platforms: linux/amd64,linux/arm64
      versions-override: " "
      labels-json: '{"org.opencontainers.image.source":"https://github.com/aerospike/aerospike-server.docker","org.opencontainers.image.url":"https://github.com/aerospike/aerospike-server.docker","org.opencontainers.image.vendor":"Aerospike","org.opencontainers.image.documentation":"https://hub.docker.com/_/aerospike","com.aerospike.asadm.version":"${{ needs.docker-context.outputs.ASADM_VERSION }}"}'
      push: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.push_docker_jfrog == true ||
          github.event.inputs.push_docker_jfrog == 'true') &&
        needs.setup.outputs.IS_RELEASE_REF == 'true' &&
        needs.jfrog-precheck.outputs.bundle_exists == 'false' }}

  docker-federal:
    needs: [setup, artifacts-ready, docker-context, jfrog-precheck]
    if: always() && needs.docker-context.result == 'success'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@v4.1.0
    with:
      app-version: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
      app-name: Aerospike Federal Server
      image-name: aerospike-server-federal
      jf-project: database
      repo-scope: -docker-dev-local
      jf-build-name: aerospike-server-docker-federal-bsd
      oidc-provider-name: database-gh-citrusleaf
      oidc-audience: database-gh-citrusleaf
      gh-context-artifacts-json: '[{"name":"docker-ctx-federal-${{ needs.setup.outputs.VERSION }}","dest":"docker-ctx"}]'
      file: docker-ctx/Dockerfile
      # Federal ships amd64 only — build_edition.bash skips fips on arm64, so
      # there is no arm64 federal package to put in an image.
      platforms: linux/amd64
      versions-override: " "
      labels-json: '{"org.opencontainers.image.source":"https://github.com/aerospike/aerospike-server.docker","org.opencontainers.image.url":"https://github.com/aerospike/aerospike-server.docker","org.opencontainers.image.vendor":"Aerospike","org.opencontainers.image.documentation":"https://hub.docker.com/_/aerospike","com.aerospike.asadm.version":"${{ needs.docker-context.outputs.ASADM_VERSION }}"}'
      push: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.push_docker_jfrog == true ||
          github.event.inputs.push_docker_jfrog == 'true') &&
        needs.setup.outputs.IS_RELEASE_REF == 'true' &&
        needs.jfrog-precheck.outputs.bundle_exists == 'false' }}

  # The reusable workflow builds and pushes in one shot, so on a pushed run the
  # functional tests and the Snyk scan move behind the push and run against the
  # pushed immutable tags (test.sh -i works on any registry image). Nothing pushed
  # is bundled or promoted unless this job passes: create-docker-release-bundle and
  # create-release-bundle both sit behind docker-ready, which fails a run whose
  # images reached the registry without a successful docker-test.
  #
  # A dry run (push=false) leaves nothing to pull — the reusable workflow neither
  # pushes nor loads the image — so this job rebuilds each edition for linux/amd64
  # from the very same context artifacts and tests those instead. That keeps the
  # generated context (re-anchored COPY sources, the entrypoint exec bit, the
  # staged .deb) under test on dev refs, which is where a break in it should
  # surface; arm64 coverage stays on pushed runs, where the image already exists.
  docker-test:
    needs: [setup, artifacts-ready, docker-community, docker-enterprise, docker-federal]
    if: >
      always() &&
      needs.docker-community.result == 'success' &&
      needs.docker-enterprise.result == 'success' &&
      needs.docker-federal.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      snyk_summary: ${{ steps.snyk_scan.outputs.summary }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout (for summarize_snyk_scan.sh)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/bin/summarize_snyk_scan.sh
            .github/bin/random_output_delimiter.sh
          sparse-checkout-cone-mode: false

      - name: Resolve test target
        id: mode
        env:
          ENTERPRISE_DIGEST: ${{ needs.docker-enterprise.outputs.digest }}
        run: |
          set -euo pipefail
          # A digest means the manifests reached the registry. The three build jobs
          # share one push expression, so enterprise speaks for all of them.
          if [[ -n "$ENTERPRISE_DIGEST" ]]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Testing the pushed immutable tags."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::images were not pushed; testing locally rebuilt linux/amd64 images instead."
          fi

      # Only the pushed path pulls from Artifactory; a local rebuild needs nothing
      # but the public base image.
      - name: Install JFrog CLI
        id: jf
        if: steps.mode.outputs.pushed == 'true'
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-citrusleaf
          oidc-audience: database-gh-citrusleaf

      - name: Docker login to Artifactory
        if: steps.mode.outputs.pushed == 'true'
        uses: step-security/docker-login-action@164e21d7e52229904128e2f946001cb88278c33d # v4.2.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Checkout aerospike-server.docker repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: aerospike/aerospike-server.docker
          path: pkg/docker
          ref: ${{ env.DOCKER_IMAGE_REPO_REF }}
          fetch-depth: 1

      # Running the pushed arm64 image on an amd64 runner needs binfmt handlers.
      # The local rebuild is amd64-only, so it needs neither QEMU nor emulation.
      - name: Set up QEMU
        if: steps.mode.outputs.pushed == 'true'
        uses: step-security/setup-qemu-action@fe44c529aab16157fc475f4991a7f926aa9a02a2 # v4.1.0

      - name: Set up Docker Buildx
        if: steps.mode.outputs.pushed == 'false'
        uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0

      - name: Download community build context
        if: steps.mode.outputs.pushed == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-ctx-community-${{ needs.setup.outputs.VERSION }}
          path: docker-ctx-root/community/docker-ctx

      - name: Download enterprise build context
        if: steps.mode.outputs.pushed == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-ctx-enterprise-${{ needs.setup.outputs.VERSION }}
          path: docker-ctx-root/enterprise/docker-ctx

      - name: Download federal build context
        if: steps.mode.outputs.pushed == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-ctx-federal-${{ needs.setup.outputs.VERSION }}
          path: docker-ctx-root/federal/docker-ctx

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Test pushed Docker images
        if: steps.mode.outputs.pushed == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          COMMUNITY_TAG: ${{ needs.docker-community.outputs.immutable-tag }}
          ENTERPRISE_TAG: ${{ needs.docker-enterprise.outputs.immutable-tag }}
          FEDERAL_TAG: ${{ needs.docker-federal.outputs.immutable-tag }}
        run: |
          set -euo pipefail
          cd pkg/docker
          status=0
          # test.sh takes one image and one platform per call, and -c drops each
          # image once its test passes so the runner disk survives all five.
          test_one() {
            echo "::group::test.sh -i $1 -e $2 -p $3"
            ./test.sh -i "$1" -e "$2" -p "$3" -c -s || status=1
            echo "::endgroup::"
          }
          test_one "$COMMUNITY_TAG"  community  linux/amd64
          test_one "$COMMUNITY_TAG"  community  linux/arm64
          test_one "$ENTERPRISE_TAG" enterprise linux/amd64
          test_one "$ENTERPRISE_TAG" enterprise linux/arm64
          test_one "$FEDERAL_TAG"    federal    linux/amd64
          exit "$status"

      - name: Build and test Docker images locally
        if: steps.mode.outputs.pushed == 'false'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          PACKAGE_VERSION: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
          CTX_ROOT: ${{ github.workspace }}/docker-ctx-root
        run: |
          set -euo pipefail
          cd pkg/docker
          # The build context is the directory ABOVE the downloaded one: the COPY
          # sources — and the Dockerfile.dockerignore that keeps everything else out
          # of the context — are anchored under docker-ctx/, exactly as the reusable
          # workflow lays them out.
          build_and_test() {
            local edition=$1 tag=$2
            docker buildx build --load --platform linux/amd64 -t "$tag" \
              -f "${CTX_ROOT}/${edition}/docker-ctx/Dockerfile" \
              "${CTX_ROOT}/${edition}" || return 1
            # -c drops the image once its test passes, keeping the runner disk clear
            # for the next edition.
            ./test.sh -i "$tag" -e "$edition" -p linux/amd64 -c -s
          }
          status=0
          for edition in community enterprise federal; do
            tag="aerospike-server-${edition}-dryrun:${PACKAGE_VERSION}"
            echo "::group::build + test ${tag} (linux/amd64)"
            build_and_test "$edition" "$tag" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload Snyk scan logs
        id: upload_snyk
        # Diagnostics only, and it now runs AFTER the push: a flaky artifact upload must
        # not fail docker-test, which would fail docker-ready and block both release
        # bundles with the images already in the registry. summarize_snyk_scan.sh treats
        # ARTIFACT_URL as optional, so the summary just omits the link.
        continue-on-error: true
        if: always() && hashFiles('pkg/docker/*.snyk') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snyk-logs-${{ needs.setup.outputs.VERSION }}
          path: pkg/docker/*.snyk
          retention-days: 14

      - name: Summarize Snyk scan results
        id: snyk_scan
        if: always()
        continue-on-error: true
        env:
          ARTIFACT_URL: ${{ steps.upload_snyk.outputs.artifact-url }}
        run: bash "${GITHUB_WORKSPACE}/.github/bin/summarize_snyk_scan.sh"

  # Single gate the release tail hangs off, so create-release-bundle and
  # notify-slack do not each have to reason about five Docker job results. Also
  # the one place the Docker release bundle coordinate is derived.
  docker-ready:
    # setup is already an ancestor via docker-context, so naming it here adds no edge
    # and no cycle. Without it this job's always() defeats skip propagation entirely and
    # it boots a runner on every run where setup itself was skipped -- both nightly
    # crons here, and every push in sign-build-deploy.yaml when its repo variable is
    # unset -- reporting a green "docker-ready" for a run that did no Docker work.
    needs: [setup, docker-context, docker-community, docker-enterprise, docker-federal, docker-test]
    if: always() && github.repository_owner == 'citrusleaf' && needs.setup.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      PUSHED: ${{ steps.gate.outputs.pushed }}
      BUNDLE_VERSION: ${{ steps.gate.outputs.bundle_version }}
      TIME_DISPLAY: ${{ steps.gate.outputs.time_display }}
      COMMUNITY_TAG: ${{ needs.docker-community.outputs.immutable-tag }}
      ENTERPRISE_TAG: ${{ needs.docker-enterprise.outputs.immutable-tag }}
      FEDERAL_TAG: ${{ needs.docker-federal.outputs.immutable-tag }}
      COMMUNITY_DIGEST: ${{ needs.docker-community.outputs.digest }}
      ENTERPRISE_DIGEST: ${{ needs.docker-enterprise.outputs.digest }}
      FEDERAL_DIGEST: ${{ needs.docker-federal.outputs.digest }}
      SNYK_SUMMARY: ${{ needs.docker-test.outputs.snyk_summary }}
      ASADM_VERSION: ${{ needs.docker-context.outputs.ASADM_VERSION }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Gate
        id: gate
        env:
          # 'skipped' is accepted so a docker-disabled run (build_docker_images=false),
          # where every job here is skipped, still lets the artifact release bundle
          # proceed. A run that DID build (dry or pushed) has a real docker-test
          # result, and a failing one lands in this loop and blocks the bundle.
          RESULTS: >-
            ${{ needs.docker-context.result }} ${{ needs.docker-community.result }}
            ${{ needs.docker-enterprise.result }} ${{ needs.docker-federal.result }}
            ${{ needs.docker-test.result }}
          ENTERPRISE_TAG: ${{ needs.docker-enterprise.outputs.immutable-tag }}
          ENTERPRISE_DIGEST: ${{ needs.docker-enterprise.outputs.digest }}
          COMMUNITY_DIGEST: ${{ needs.docker-community.outputs.digest }}
          FEDERAL_DIGEST: ${{ needs.docker-federal.outputs.digest }}
          DOCKER_TEST_RESULT: ${{ needs.docker-test.result }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::Docker leg finished '${result}'; blocking the release tail."
                 exit 1 ;;
            esac
          done

          if [[ -z "$ENTERPRISE_DIGEST" ]]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Docker images were not pushed; no Docker release bundle for this run."
            exit 0
          fi

          # create-docker-release-bundle bundles all three editions' build-infos, so a
          # partial publish must fail HERE -- before a bundle exists -- rather than at
          # docker-mutable-tags, which is the first place the other two digests were
          # otherwise checked and which runs after the bundle is created AND promoted.
          # The three build jobs share one push expression, so reaching this point with
          # enterprise published and another edition not means that edition reported
          # success without publishing a manifest.
          for pair in "community=${COMMUNITY_DIGEST}" "federal=${FEDERAL_DIGEST}"; do
            if [[ -z "${pair#*=}" ]]; then
              echo "::error::${pair%%=*} published no manifest digest while enterprise did; refusing to bundle a partial set."
              exit 1
            fi
          done

          # A non-empty digest means the images are in the registry, so docker-test had
          # something to pull and must have run: the blanket 'skipped' allowance above
          # exists for a docker-disabled run, not to let a pushed build reach a release
          # bundle untested.
          if [[ "$DOCKER_TEST_RESULT" != "success" ]]; then
            echo "::error::images were pushed but docker-test finished '${DOCKER_TEST_RESULT}'; refusing to publish an untested build."
            exit 1
          fi

          # Immutable tag: <registry>/<image>:<app-version>_<UTC timestamp>. The
          # bundle version is that tag's version component. The reusable workflow
          # stamps its own timestamp per invocation, so the three editions differ by
          # a few seconds; enterprise is the canonical one for the bundle coordinate.
          bundle_version="${ENTERPRISE_TAG##*:}"
          if [[ ! "$bundle_version" =~ ^[^:/]+_[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "::error::unexpected immutable tag '${ENTERPRISE_TAG}'; cannot derive a bundle version."
            exit 1
          fi
          ts="${bundle_version##*_}"

          {
            echo "pushed=true"
            echo "bundle_version=${bundle_version}"
            echo "time_display=$(date -u -d "${ts:0:4}-${ts:4:2}-${ts:6:2} ${ts:9:2}:${ts:11:2}:${ts:13:2}" '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_OUTPUT"
          echo "Docker release bundle coordinate: aerospike-server-docker/${bundle_version}"

  promote-to-test:
    needs: [setup, create-release-bundle, jfrog-precheck]
    # Runs when this run created the bundle (create success) OR the bundle already exists
    # (a prior run created it but may not have promoted it, or a dup re-run). The step is
    # idempotent — it checks the TEST promotion record and exits 0 if already promoted — so
    # re-entry here is safe.
    if: >
      always() &&
      needs.setup.outputs.IS_RELEASE_REF == 'true' &&
      (needs.create-release-bundle.result == 'success' ||
        needs.jfrog-precheck.outputs.bundle_exists == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ env.JFROG_URL }}
          JF_PROJECT: ${{ env.JFROG_PROJECT }}
        with:
          oidc-provider-name: database-gh-citrusleaf
          oidc-audience: database-gh-citrusleaf

      - name: Promote release bundle to TEST
        env:
          JFROG_PROJECT: ${{ env.JFROG_PROJECT }}
          RELEASE_BUNDLE_NAME: aerospike-server
          JF_SIGNING_KEY: aerospike
          VERSION: ${{ needs.setup.outputs.BUNDLE_VERSION }}
        run: |
          set -euo pipefail
          # Check if already promoted to TEST
          status=$(jf rt curl -s -XGET "/lifecycle/api/v2/promotion/records/${RELEASE_BUNDLE_NAME}/${VERSION}?project=${JFROG_PROJECT}" | jq -r '.promotions[]? | select(.environment == "TEST") | .status' 2>/dev/null || true)
          if [[ "$status" == "COMPLETED" ]]; then
            echo "Release bundle '${RELEASE_BUNDLE_NAME}:${VERSION}' is already promoted to TEST — skipping."
            exit 0
          fi
          echo "Promoting release bundle '${RELEASE_BUNDLE_NAME}:${VERSION}' to TEST environment..."
          jf rbp \
            --signing-key="${JF_SIGNING_KEY}" \
            --project="${JFROG_PROJECT}" \
            --sync=true \
            "${RELEASE_BUNDLE_NAME}" "${VERSION}" TEST

  # The Docker images get their own release bundle, separate from the artifact
  # bundle above. Its content is exactly the immutable-tagged manifests: the
  # reusable workflow creates each edition's build-info against
  # <immutable-tag>@<manifest-list digest>, and versions-override=" " means no
  # other tag was ever pushed.
  #
  # No jfrog-precheck equivalent: the bundle version carries the immutable tag's
  # UTC timestamp, which the reusable workflow stamps fresh per run, so the
  # coordinate is new every time and cannot collide with an existing bundle.
  #
  # The artifact leg must not have FAILED before this runs. The images ship the same
  # .deb packages, so bundling them — and, downstream, moving the w.x/w.x.y tags onto
  # them — while the package bundle never reached TEST would advance the shared tags
  # past the packages they contain. 'skipped' is still accepted: both jobs skip on an
  # intentionally docker-only run (upload_built_artifacts_jfrog=false) and on an
  # already-published coordinate (bundle_exists='true'), neither of which is a failure.
  # create-release-bundle is checked as well as promote-to-test, because a FAILED
  # create-release-bundle leaves promote-to-test 'skipped', not 'failure'.
  #
  # upload-artifacts-to-jfrog is checked for the same reason one level further up:
  # its FAILURE also reduces to 'skipped' here, because create-release-bundle's own
  # gate requires (upload == 'success' || build_exists == 'true'), and a false
  # condition yields 'skipped', never 'failure'. Without this conjunct a JFrog
  # upload failure on a fresh coordinate would bundle the images and move the
  # w.x/w.x.y tags onto packages that never reached Artifactory at all. Testing
  # != 'failure' rather than == 'success' keeps both intentional skips (a
  # docker-only run, an already-published coordinate) working unchanged.
  create-docker-release-bundle:
    needs: [setup, docker-ready, create-release-bundle, promote-to-test, upload-artifacts-to-jfrog]
    if: >
      always() &&
      needs.docker-ready.result == 'success' &&
      needs.docker-ready.outputs.PUSHED == 'true' &&
      needs.setup.outputs.IS_RELEASE_REF == 'true' &&
      needs.upload-artifacts-to-jfrog.result != 'failure' &&
      (needs.create-release-bundle.result == 'success' ||
        needs.create-release-bundle.result == 'skipped') &&
      (needs.promote-to-test.result == 'success' ||
        needs.promote-to-test.result == 'skipped')
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@v3.7.0
    with:
      jf-project: "database"
      # One build-info per edition. The reusable Docker workflow publishes build-info
      # as <jf-build-name>:${{ github.run_number }} — the build number is not an input,
      # it is always this run's number.
      jf-build-names: "aerospike-server-docker-community-bsd:${{ github.run_number }},aerospike-server-docker-enterprise-bsd:${{ github.run_number }},aerospike-server-docker-federal-bsd:${{ github.run_number }}"
      jf-bundle-name: "aerospike-server-docker"
      oidc-provider-name: gh-citrusleaf
      oidc-audience: citrusleaf
      version: ${{ needs.docker-ready.outputs.BUNDLE_VERSION }}
      runs-on: ubuntu-24.04
      gh-workflows-ref: "v3.7.0"
      dry-run: false

  promote-docker-to-test:
    needs: [docker-ready, create-docker-release-bundle]
    if: always() && needs.create-docker-release-bundle.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ env.JFROG_URL }}
          JF_PROJECT: ${{ env.JFROG_PROJECT }}
        with:
          oidc-provider-name: database-gh-citrusleaf
          oidc-audience: database-gh-citrusleaf

      - name: Promote Docker release bundle to TEST
        env:
          JFROG_PROJECT: ${{ env.JFROG_PROJECT }}
          RELEASE_BUNDLE_NAME: aerospike-server-docker
          JF_SIGNING_KEY: aerospike
          VERSION: ${{ needs.docker-ready.outputs.BUNDLE_VERSION }}
        run: |
          set -euo pipefail
          # Check if already promoted to TEST — the bundle version is unique per run,
          # so this only guards a re-run of this job against the same coordinate.
          status=$(jf rt curl -s -XGET "/lifecycle/api/v2/promotion/records/${RELEASE_BUNDLE_NAME}/${VERSION}?project=${JFROG_PROJECT}" | jq -r '.promotions[]? | select(.environment == "TEST") | .status' 2>/dev/null || true)
          if [[ "$status" == "COMPLETED" ]]; then
            echo "Release bundle '${RELEASE_BUNDLE_NAME}:${VERSION}' is already promoted to TEST — skipping."
            exit 0
          fi
          echo "Promoting release bundle '${RELEASE_BUNDLE_NAME}:${VERSION}' to TEST environment..."
          jf rbp \
            --signing-key="${JF_SIGNING_KEY}" \
            --project="${JFROG_PROJECT}" \
            --sync=true \
            "${RELEASE_BUNDLE_NAME}" "${VERSION}" TEST

  # These tags are mutable: each points at the newest tested build of the line it names.
  # master owns w.x as well as w.x.y and w.x.y.z, because the trunk is the newest build of
  # the lineage; a hotfix line owns only its own w.x.y and w.x.y.z.
  # They are applied here, not through the reusable workflow's versions-override, for two
  # reasons: versions-override tags at build time, so a build that later fails docker-test
  # would leave x.y pointing at a broken image, and the tag has to be written in both repos
  # the image ends up in — promote-docker-to-test is what copies it into
  # database-docker-test-local, so this has to run after it.
  #
  # Running last is also what keeps these tags out of every release bundle. Each bundle is
  # assembled from build-info the reusable workflow published against <immutable-tag>@<digest>
  # before this job starts, and a tag is its own repository path, so a bundle can only ever
  # reference the immutable one. Nothing here runs a jf command that collects artifacts.
  docker-mutable-tags:
    needs: [setup, artifacts-ready, docker-ready, promote-docker-to-test]
    outputs:
      # What each tag pointed at before this job moved it, so a bad cut can be put
      # back with the same imagetools call. Also printed to the step summary.
      PREVIOUS_DIGESTS: ${{ steps.apply.outputs.previous_digests }}
    if: >
      always() &&
      needs.docker-ready.result == 'success' &&
      needs.docker-ready.outputs.PUSHED == 'true' &&
      needs.promote-docker-to-test.result == 'success' &&
      github.event.inputs.docker_mutable_tags != 'off'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-citrusleaf
          oidc-audience: database-gh-citrusleaf

      - name: Docker login to Artifactory
        uses: step-security/docker-login-action@164e21d7e52229904128e2f946001cb88278c33d # v4.2.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0

      - name: Resolve mutable tags
        id: tags
        env:
          MODE: ${{ github.event.inputs.docker_mutable_tags }}
          PACKAGE_VERSION: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
        run: |
          set -euo pipefail

          # A trailing -<n> is the build number the packages carry (8.1.2.5-3, 8.1.3.0-88);
          # anything else after w.x.y.z is a git descriptor (8.1.3.0-88-g0f294c425-1), which is
          # what a preview build produces. Both forms still yield the tags, so 'force' can
          # exercise this job on a preview ref.
          if [[ "$PACKAGE_VERSION" =~ ^((([0-9]+\.[0-9]+)\.[0-9]+)\.[0-9]+)(-[0-9]+)?$ ]]; then
            release_coordinate=true
          elif [[ "$PACKAGE_VERSION" =~ ^((([0-9]+\.[0-9]+)\.[0-9]+)\.[0-9]+)-.*$ ]]; then
            release_coordinate=false
          else
            echo "::error::cannot derive w.x.y.z from package version '${PACKAGE_VERSION}'."
            exit 1
          fi
          wxyz="${BASH_REMATCH[1]}"
          wxy="${BASH_REMATCH[2]}"
          wx="${BASH_REMATCH[3]}"

          # master is the newest build of the lineage, so it owns w.x on top of its own
          # w.x.y/w.x.y.z. A hotfix line is an older patch line within that lineage and must
          # not take w.x from the trunk.
          case "$GITHUB_REF_NAME" in
          master)
            tags="${wxyz} ${wxy} ${wx}"
            ;;
          hotfix/*)
            tags="${wxyz} ${wxy}"
            ;;
          *)
            if [[ "$MODE" != "force" ]]; then
              echo "::notice::'${GITHUB_REF_NAME}' is not master or a hotfix release line; leaving the mutable tags untouched (re-dispatch with docker_mutable_tags=force to override)."
              echo "apply=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tags="${wxyz} ${wxy} ${wx}"
            ;;
          esac

          if [[ "$release_coordinate" != "true" ]]; then
            if [[ "$MODE" == "force" ]]; then
              # Deliberately not "re-run master to reclaim them": nothing reclaims these.
              # A later master run computes w.x.y.z/w.x.y/w.x from ITS OWN version, so
              # once master has moved to the next lineage these tags are never written
              # again by any release, and a hotfix line never takes w.x at all. They stay
              # on this build until someone repoints them by hand.
              echo "::warning::docker_mutable_tags=force: pointing ${tags// /, } at ${PACKAGE_VERSION}, which is not a release-line build. NO later run reclaims these — a release writes only its own version's tags. Repoint them by hand (or delete them, if this run created them) using the pre-move digests printed by the next step."
            else
              # master and hotfix/** always publish a w.x.y.z-<n> coordinate. A descriptor here
              # means the version derivation changed, and moving a shared tag on a guess is
              # worse than stopping.
              echo "::error::package version '${PACKAGE_VERSION}' carries a git descriptor, so it names no release coordinate."
              exit 1
            fi
          fi

          {
            echo "apply=true"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
          echo "Mutable tags for ${PACKAGE_VERSION} on ${GITHUB_REF_NAME}: ${tags// /, }"

      - name: Apply mutable tags
        id: apply
        if: steps.tags.outputs.apply == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          COMMUNITY_DIGEST: ${{ needs.docker-ready.outputs.COMMUNITY_DIGEST }}
          ENTERPRISE_DIGEST: ${{ needs.docker-ready.outputs.ENTERPRISE_DIGEST }}
          FEDERAL_DIGEST: ${{ needs.docker-ready.outputs.FEDERAL_DIGEST }}
        run: |
          set -euo pipefail
          registry=artifact.aerospike.io

          read -ra tags <<<"$TAGS"
          [[ "${#tags[@]}" -gt 0 ]] || { echo "::error::no tags resolved"; exit 1; }

          images=(
            "aerospike-server=${COMMUNITY_DIGEST}"
            "aerospike-server-enterprise=${ENTERPRISE_DIGEST}"
            "aerospike-server-federal=${FEDERAL_DIGEST}"
          )

          # Every digest is checked before the first tag is written: a missing one
          # discovered mid-loop would leave the editions on different builds.
          for entry in "${images[@]}"; do
            [[ -n "${entry#*=}" ]] || { echo "::error::no digest for ${entry%%=*}"; exit 1; }
          done

          # Record what each tag points at BEFORE moving it. These writes are the only
          # ones in this pipeline that mutate a coordinate already published, and there
          # is no supersede path: reverting this repo does not move a tag back. Without
          # the previous digest written down, restoring one means finding it by hand.
          # "absent" means the tag did not exist yet, i.e. rollback = delete it.
          declare -a previous=()
          for repo in database-docker-dev-local database-docker-test-local; do
            for entry in "${images[@]}"; do
              base="${registry}/${repo}/${entry%%=*}"
              for tag in "${tags[@]}"; do
                prev="$(docker buildx imagetools inspect "${base}:${tag}" \
                  --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest' 2>/dev/null)" || prev=""
                previous+=("${base}:${tag} ${prev:-absent}")
              done
            done
          done

          printf 'pre-move: %s\n' "${previous[@]}"
          {
            echo "### Mutable tags — digests before this run"
            echo ""
            echo "Restore by re-running \`imagetools create\` with the previous digest."
            echo ""
            echo "| tag | previous digest |"
            echo "|---|---|"
            for entry in "${previous[@]}"; do
              echo "| \`${entry%% *}\` | \`${entry#* }\` |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${previous[@]}" | jq -Rs 'split("\n") | map(select(length>0) | split(" ") | {tag: .[0], previous: .[1]})' >/tmp/previous-tags.json
          {
            echo "previous_digests<<PREVDIGESTS"
            cat /tmp/previous-tags.json
            echo "PREVDIGESTS"
          } >>"$GITHUB_OUTPUT"

          # Retagging an existing index by digest: buildx copies the source manifest
          # rather than rebuilding it, so every tag must resolve back to the same digest
          # the release bundle references. Verified because a rebuilt index would still
          # push cleanly under a different digest.
          retag_and_verify() {
            local base=$1 digest=$2 tag got
            local -a tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(-t "${base}:${tag}")
            done
            docker buildx imagetools create "${tag_args[@]}" "${base}@${digest}" || return 1
            for tag in "${tags[@]}"; do
              got="$(docker buildx imagetools inspect "${base}:${tag}" --format '{{json .Manifest}}' | jq -r '.digest')" || return 1
              if [[ "$got" != "$digest" ]]; then
                echo "::error::${base}:${tag} resolves to ${got}, expected ${digest}."
                return 1
              fi
              echo "${base}:${tag} -> ${got}"
            done
          }

          failed=()
          for repo in database-docker-dev-local database-docker-test-local; do
            for entry in "${images[@]}"; do
              image="${entry%%=*}"
              digest="${entry#*=}"
              base="${registry}/${repo}/${image}"

              echo "::group::${base} ${TAGS// /, } -> ${digest}"
              ok=false
              # Moving a mutable tag is idempotent, so a transient registry error is
              # worth another attempt before giving up on this image.
              for attempt in 1 2 3; do
                [[ "$attempt" -eq 1 ]] || { echo "attempt ${attempt}/3..."; sleep 5; }
                if retag_and_verify "$base" "$digest"; then
                  ok=true
                  break
                fi
              done
              echo "::endgroup::"
              # These tags are meant to move as a set, so keep going instead of
              # bailing out: finishing the rest converges as much of the set as the
              # registry allows, and the summary below names what stayed behind.
              "$ok" || failed+=("$base")
            done
          done

          if [[ "${#failed[@]}" -gt 0 ]]; then
            echo "::error::mutable tags not applied for: ${failed[*]}. These images still point at their previous build while the others moved to this one; re-run this job to converge them."
            exit 1
          fi

  # docker-mutable-tags is deliberately NOT required to have succeeded: it is
  # 'skipped' whenever docker_mutable_tags=off, and a tagging failure still leaves
  # the packages and images promoted to TEST — QE needs to hear about that either
  # way. Its result is reported in the message body instead.
  # Neither create-docker-release-bundle nor promote-docker-to-test is required to
  # have succeeded, for the same reason docker-mutable-tags is not: by the time they
  # run, the packages are bundled and promoted to TEST and the images are pushed and
  # tested. A JFrog Lifecycle failure in either is bookkeeping — QE still needs to
  # hear that the release reached TEST. Both results are reported in the body.
  notify-slack:
    needs: [setup, artifacts-ready, docker-ready, promote-to-test, create-docker-release-bundle, promote-docker-to-test, docker-mutable-tags]
    if: >
      always() &&
      needs.promote-to-test.result == 'success' &&
      needs.docker-ready.result == 'success' &&
      needs.docker-ready.outputs.PUSHED == 'true' &&
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.upload_built_artifacts_jfrog == true || github.event.inputs.upload_built_artifacts_jfrog == 'true') &&
        (github.event.inputs.push_docker_jfrog == true || github.event.inputs.push_docker_jfrog == 'true') &&
        (github.event.inputs.slack_notify == true || github.event.inputs.slack_notify == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.setup.outputs.VERSION }}
      BUNDLE_VERSION: ${{ needs.setup.outputs.BUNDLE_VERSION }}
      PACKAGE_VERSION: ${{ needs.artifacts-ready.outputs.PACKAGE_VERSION }}
      BRANCH: ${{ github.ref_name }}
      TIME_DISPLAY: ${{ needs.docker-ready.outputs.TIME_DISPLAY }}
      DOCKER_BUNDLE_VERSION: ${{ needs.docker-ready.outputs.BUNDLE_VERSION }}
      ASADM_VERSION: ${{ needs.docker-ready.outputs.ASADM_VERSION }}
      COMMUNITY_TAG: ${{ needs.docker-ready.outputs.COMMUNITY_TAG }}
      ENTERPRISE_TAG: ${{ needs.docker-ready.outputs.ENTERPRISE_TAG }}
      FEDERAL_TAG: ${{ needs.docker-ready.outputs.FEDERAL_TAG }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout (for changelog)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute changelog since last successful build
        id: changelog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          MAX_COMMITS: "50"
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash "${GITHUB_WORKSPACE}/.github/bin/changelog_since_last_successful_run.sh"

      - name: Set Slack message text
        id: slack_text
        env:
          SLACK_TITLE: ${{ env.VERSION }} promoted to JFrog TEST
          SLACK_MSG: |
            *Time:* ${{ env.TIME_DISPLAY }}
            *Branch:* ${{ env.BRANCH }}
            *Build Id:* ${{ env.VERSION }}
            *Package Version:* ${{ env.PACKAGE_VERSION }}
            *Bundle Version:* ${{ env.BUNDLE_VERSION }}
            *Docker Bundle Version:* ${{ env.DOCKER_BUNDLE_VERSION }}
            *asadm:* ${{ env.ASADM_VERSION }}
        run: |
          set -euo pipefail
          random_delim() { bash "${GITHUB_WORKSPACE}/.github/bin/random_output_delimiter.sh" "$1"; }
          delimiter="$(random_delim SLACK)"
          {
            echo "title<<${delimiter}"
            echo "$SLACK_TITLE"
            echo "${delimiter}"
            echo "body<<${delimiter}"
            echo "$SLACK_MSG"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          # Slack linkifies URLs in mrkdwn (including fenced code). plain_text sections do not auto-link;
          # one block per docker pull keeps each command on its own line.
          # The immutable tag is the ONLY tag pushed (versions-override=" "), so print the
          # reusable workflow's tags verbatim rather than reconstructing them.

          hd="$(random_delim DH)"
          {
            echo "docker_heading<<${hd}"
            printf '%s\n' '*Docker images:*'
            echo "${hd}"
          } >> "$GITHUB_OUTPUT"

          d1="$(random_delim DP1)"
          {
            echo "docker_pull_1<<${d1}"
            printf 'docker pull %s\n' "$ENTERPRISE_TAG"
            echo "${d1}"
          } >> "$GITHUB_OUTPUT"
          d2="$(random_delim DP2)"
          {
            echo "docker_pull_2<<${d2}"
            printf 'docker pull %s\n' "$FEDERAL_TAG"
            echo "${d2}"
          } >> "$GITHUB_OUTPUT"
          d3="$(random_delim DP3)"
          {
            echo "docker_pull_3<<${d3}"
            printf 'docker pull %s\n' "$COMMUNITY_TAG"
            echo "${d3}"
          } >> "$GITHUB_OUTPUT"
          dwf="$(random_delim SLACK_WF)"
          {
            echo "workflow_mrk<<${dwf}"
            echo "<${RUN_URL}|Workflow run>"
            echo "${dwf}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Slack message with Snyk summary
        id: slack_body
        env:
          BASE_BODY: ${{ steps.slack_text.outputs.body }}
          SNYK_SUMMARY: ${{ needs.docker-ready.outputs.SNYK_SUMMARY }}
          MUTABLE_TAGS_RESULT: ${{ needs.docker-mutable-tags.result }}
          DOCKER_BUNDLE_RESULT: ${{ needs.create-docker-release-bundle.result }}
          DOCKER_PROMOTE_RESULT: ${{ needs.promote-docker-to-test.result }}
        run: |
          set -euo pipefail
          delimiter="$(bash "${GITHUB_WORKSPACE}/.github/bin/random_output_delimiter.sh" SLACK_BODY)"
          {
            echo "body<<${delimiter}"
            echo "$BASE_BODY"
            echo ""
            echo "*Snyk Container Scan:*"
            if [[ -n "${SNYK_SUMMARY}" ]]; then
              echo "$SNYK_SUMMARY"
            else
              echo "_scan did not run_"
            fi
            # The Docker bundle leg runs after the packages are already in TEST, so a
            # failure here degrades the message rather than suppressing it.
            if [[ "$DOCKER_PROMOTE_RESULT" != "success" ]]; then
              echo ""
              echo ":warning: *Docker release bundle:* not promoted to TEST (bundle=${DOCKER_BUNDLE_RESULT}, promote=${DOCKER_PROMOTE_RESULT}) — the images above are in dev-local only, NOT in database-docker-test-local."
            fi
            # 'skipped' is the docker_mutable_tags=off case, which needs no callout.
            case "$MUTABLE_TAGS_RESULT" in
              success | skipped) ;;
              *) echo ""
                 echo ":warning: *Mutable tags:* not applied (${MUTABLE_TAGS_RESULT}) — the w.x/w.x.y tags may still point at the previous build." ;;
            esac
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack message to QE
        continue-on-error: true
        uses: step-security/slack-github-action@16410fbfd088e8034b2d1cda051d29ada4097065 # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.QE_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.QE_SLACK_CHANNEL }}",
              "text": ${{ toJSON(steps.slack_text.outputs.title) }},
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.title) }}, "emoji": true } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_body.outputs.body) }} } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.changelog.outputs.body) }} } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_text.outputs.docker_heading) }} } },
                { "type": "section", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.docker_pull_1) }}, "emoji": false } },
                { "type": "section", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.docker_pull_2) }}, "emoji": false } },
                { "type": "section", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.docker_pull_3) }}, "emoji": false } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_text.outputs.workflow_mrk) }} } }
              ]
            }

      - name: Send Slack message to CORE
        continue-on-error: true
        uses: step-security/slack-github-action@16410fbfd088e8034b2d1cda051d29ada4097065 # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.DB_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.DB_SLACK_CHANNEL }}",
              "text": ${{ toJSON(steps.slack_text.outputs.title) }},
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.title) }}, "emoji": true } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_body.outputs.body) }} } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.changelog.outputs.body) }} } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_text.outputs.docker_heading) }} } },
                { "type": "section", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.docker_pull_1) }}, "emoji": false } },
                { "type": "section", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.docker_pull_2) }}, "emoji": false } },
                { "type": "section", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.docker_pull_3) }}, "emoji": false } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_text.outputs.workflow_mrk) }} } }
              ]
            }
