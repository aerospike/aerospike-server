name: PR title check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Require JIRA ticket ID in title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Allow dependabot / automated dependency-bump PRs.
          if printf '%s' "$TITLE" | grep -qiE '^bump '; then
            echo "OK: '$TITLE' is an automated dependency bump"
          # One or more comma-separated JIRA ticket IDs followed by " - ".
          elif printf '%s' "$TITLE" | grep -qE '^[A-Z]+-[0-9]+(, [A-Z]+-[0-9]+)* - '; then
            echo "OK: '$TITLE' begins with JIRA ticket ID(s)"
          else
            echo "::error::PR title must begin with JIRA ticket ID(s) (e.g. SERVER-1234 or SERVER-1234, AER-5678) or be a dependency bump. Got: '$TITLE'"
            exit 1
          fi
      - name: Comment on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "PR title must begin with JIRA ticket ID(s) (e.g. SERVER-1234 or SERVER-1234, AER-5678), or be a dependency bump."
