name: PR title check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Require JIRA ticket ID in title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^[A-Z]+-[0-9]+ - '; then
            echo "OK: '$TITLE' begins with an uppercase JIRA ticket ID"
          else
            echo "::error::PR title must begin with an uppercase JIRA ticket ID (e.g. SERVER-1234). Got: '$TITLE'"
            exit 1
          fi
      - name: Comment on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "PR title must begin with an uppercase JIRA ticket ID (e.g. SERVER-1234)."
