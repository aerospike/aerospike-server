# Re-issues GitHub's native review request to the assignees of every open PR
# who owe one, three mornings a week. It never comments on a PR and never
# submits a review; the notification GitHub sends for a review request is the
# whole mechanism.
#
# How to stop being nudged about a PR, since none of this is discoverable from
# the notification itself:
#
#   - Submit a verdict (approve or request changes) on the current head. A
#     COMMENTED review is not a verdict and only defers the nudge by the floor.
#   - Remove your own review request. That is read back as an opt-out and holds
#     until someone requests you again.
#   - Un-assign yourself, which also removes you as an assignee for everyone
#     else's purposes.
#
# A review request removed by someone *other* than the reviewer - a maintainer
# tidying the queue, or this workflow's own strip/re-request - is deliberately
# not an opt-out.

name: PR Review Nudge

on:
  schedule:
    # 09:00 IST (UTC+5:30) = 03:30 UTC, Mon/Wed/Fri
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the planned nudges without touching any review request
        type: boolean
        default: true
      nudge_after_days:
        description: >-
          Hold back a reviewer contacted about the PR within this many whole
          days, less 12h of slack for cron drift. 0 disables both the floor
          and the self-removal opt-out, since both read the same event walk -
          and any nudge a floor-0 run issues to an opted-out reviewer is a
          real review request that later runs read back as "someone asked
          again", permanently clearing that opt-out. Blank means unset and
          takes the same 7, silently. Any other value that is not a whole
          number between 0 and 365 falls back to 7 and says so in the log.
        type: string
        default: '7'

permissions:
  contents: read

# Every run is a full, idempotent scan of all open PRs, so two must never
# overlap: each holds pr.requested_reviewers from a snapshot taken at the start
# and acts on it minutes later, so concurrent strip/re-request sequences
# interleave against stale state. One fixed group name - not keyed on
# github.ref, which would split a dispatch on a non-default ref from the
# scheduled runs - plus cancel-in-progress: false serializes them, matching
# label-merge-conflicts.yaml.
concurrency:
  group: pr-review-nudge
  cancel-in-progress: false

jobs:
  nudge:
    # Scoped to citrusleaf so a fork cannot nudge reviewers on its parent's PRs.
    # COPYING THIS TO ANOTHER ORG: change 'citrusleaf' here, or the job is
    # skipped on every run and the workflow reports success while doing nothing
    # - every diagnostic this workflow has lives inside the skipped step.
    if: github.repository_owner == 'citrusleaf'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # A job-level permissions block replaces the top-level one rather than
      # merging with it, so contents: read has to be restated here for the
      # checkout below.
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Re-request review from PR assignees
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          # The inputs context is empty on a schedule run, so scheduled runs
          # always mutate; only a manual dispatch can ask for a dry run.
          #
          # No `|| 7` on the floor: an empty value is what the script's own
          # DEFAULT_NUDGE_AFTER_DAYS is for, and a second copy of the number
          # here would be the one both triggers actually applied, leaving the
          # named constant reachable only from a malformed dispatch. Passing the
          # input through also keeps a deliberate '0' out of a boolean cast.
          # The input's `default: '7'` above stays, as the value the dispatch
          # form shows - a mirror of the constant, not a second implementation.
          DRY_RUN: ${{ inputs.dry_run || false }}
          NUDGE_AFTER_DAYS: ${{ inputs.nudge_after_days }}
        with:
          # The action's default retry-exempt list (400,401,403,404,422) covers
          # the 422 this script handles itself, so retries only absorb 5xx.
          retries: 3
          script: |
            const nudge = require(`${process.env.GITHUB_WORKSPACE}/.github/bin/pr_review_nudge.js`);
            await nudge({ github, context, core });
